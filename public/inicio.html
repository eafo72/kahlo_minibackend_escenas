<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museo Casa Kahlo | Panel</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Flatpickr CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <!-- Usa el tema rojo -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/material_red.css">

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Oswald:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- AOS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <!-- axios for API calls -->
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>

    <!-- API configuration -->
    <script src="./config.js"></script>

    <!-- GoogleLogin configuration -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Tu CSS -->
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="wrapper">
        <div class="background-fixed"></div>

        <header class="fixed-header">
            <div class="logo-container text-center">
                <h5 class="pre-title mt-4">Controles</h5>
                <img src="./logo_rojo.png" alt="Museo Casa Kahlo Logo" class="img-fluid brand-logo">
            </div>
            <div class="text-section text-center">
                <p class="subtitle lead"></p>
            </div>
        </header>

        <main class="scroll-content">
            <div class="d-flex justify-content-center">
                <button class="btn btn-success m-4" onclick="activarEscena(1)">Activar Escena 1</button>
                <button class="btn btn-success m-4" onclick="activarEscena(2)">Activar Escena 2</button>
            </div>
        </main>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SweetAlert JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        function activarEscena(num) {
            fetch(`../activar/${num}`)
                .then(res => res.text())
                .then(() => {
                    Swal.fire('Atención', "Escena " + num + " activada", 'success');
                });

        }
    </script>

    <script>
        // Lógica de Autenticación e Inicialización
        document.addEventListener("DOMContentLoaded", async () => {
            const userToken = localStorage.getItem("usertoken");
            if (!userToken) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Sesión Requerida',
                    text: 'Por favor, inicia sesión para acceder al panel de foto oportunity.',
                    allowOutsideClick: false,
                    showConfirmButton: true
                }).then(() => {
                    window.location.href = './index.html';
                });
                return;
            }

            try {
                Swal.fire({
                    title: "Verificando sesión...",
                    allowOutsideClick: false,
                    showConfirmButton: false,
                    willOpen: () => Swal.showLoading()
                });

                const userRes = await axios.post(`${API_BASE_URL}/usuario/verificar`, {}, {
                    headers: { "x-auth-token": userToken }
                });

                Swal.close();

                if (userRes.status === 200 && userRes.data && userRes.data[0]) {

                } else {
                    throw new Error("Token inválido.");
                }
            } catch (err) {
                Swal.close();
                console.warn("Sesión no válida:", err);
                localStorage.removeItem("usertoken");
                Swal.fire({
                    icon: 'error',
                    title: 'Sesión Inválida',
                    text: 'Tu sesión no es válida. Por favor, vuelve a iniciar sesión.'
                }).then(() => {
                    window.location.href = './index.html';
                });
            }
        });
    </script>
