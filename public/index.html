<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Museo Casa Kahlo | Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Oswald:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
  <meta name="author" content="GomaLab">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="generator" content="Museo Kahlo System v2.0">
  <meta name="description" content="Tu portal privado para gestionar el sistema de foto oportunity">
  <meta name="keywords" content="Museo Casa Kahlo, Frida Kahlo.">

  <style>
    /* ... [Mantenemos el CSS existente hasta aquí] ... */

    /* ===============================
   Main Card - Nuevo diseño
   =============================== */
    .main-card {
      max-width: 450px;
      /* Ancho de la tarjeta principal */
      width: 100%;
      margin: 2rem auto;
      /* Margen para centrar y dar espacio */
      padding: 2.5rem 1.5rem;
      background-color: #fcfcfc;
      border: 1px solid #eee;
      border-radius: 12px;
      z-index: 1000;
    }

    .main-card .card-title {
      font-family: 'Oswald', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--museo-neutral);
      margin-bottom: 0.5rem;
    }

    .main-card .card-text {
      font-size: 1rem;
      color: var(--muted-color);
      margin-bottom: 2rem;
    }

    .main-card .btn-outline-secondary {
      color: var(--museo-neutral);
      border-color: var(--museo-neutral);
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      border-radius: 5px;
      transition: all 0.3s ease;
    }

    .main-card .btn-outline-secondary:hover {
      background-color: var(--museo-neutral);
      color: #fff;
    }

    /* Ajustes para la imagen del venado */
    .main-card .img-fluid.mt-4 {
      max-height: 250px;
    }

    /* ===============================
   Ajustes a secciones previas
   =============================== */
    .tickets-section {
      padding-top: 1rem;
      padding-bottom: 3.5rem;
    }

    /* Nuevo estilo para el contenedor de botones */
    #buttons-container {
      min-height: 50px;
      /* Ajusta este valor según la altura de tus botones */
      display: flex;
      justify-content: center;
      gap: 1rem;
    }


    @media (max-width: 768px) {
      .main-card {
        max-width: 90%;
        margin: 2rem auto;
      }
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <div class="background-fixed"></div>

    <header class="fixed-header">
      <div class="logo-container text-center">
        <img src="./logo_rojo.png" alt="Museo Casa Kahlo Logo" class="img-fluid brand-logo">
      </div>
    </header>

    <main class="scroll-content d-flex justify-content-center align-items-center">
      <div class="tickets-section container">
        <div class="main-card card shadow-sm text-center">
          <div class="card-body">


            <h2 class="card-title mb-4">Ingresa a tu Cuenta</h2>

            <form id="login-form">
              <div class="mb-3">
                <input type="email" id="email" class="form-control" placeholder="Correo electrónico" required>
              </div>
              <div class="mb-3">
                <input type="password" id="password" class="form-control" placeholder="Contraseña" required>
              </div>
              <button type="submit" class="btn btn-outline-secondary w-100">Ingresar</button>
            </form>

            <div class="mt-3">
              <div id="g_id_onload"
                data-client_id="418513888701-ii4jt41t9iv0um2v2b1mjt037efnucae.apps.googleusercontent.com"
                data-context="signin" data-ux_mode="popup" data-callback="handleCredentialResponse"
                data-itp_support="true">
              </div>
              <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="outline"
                data-text="signin_with" data-size="large" data-logo_alignment="left">
              </div>
            </div>


            <img src="./venado_rojo.png" alt="Imagen de un venado" class="img-fluid mt-4">
          </div>
        </div>
      </div>
    </main>
  </div>



  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <script src="./config.js"></script>

  <script>
    // ✅ Al cargar la página, verificar si hay una sesión activa y redirigir
    document.addEventListener("DOMContentLoaded", async () => {
      const token = localStorage.getItem("usertoken");
      if (token) {
        // Si el token existe, redirigir inmediatamente a la zona autenticada
        window.location.href = './inicio.html';
        return;
      }
    });



    // Login normal (Movido de historial_compras.html)
    document.getElementById("login-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      if (!email || !password) return;

      Swal.fire({
        title: "Verificando...",
        allowOutsideClick: false,
        showConfirmButton: false,
        willOpen: () => Swal.showLoading()
      });
      try {
        const res = await axios.post(`${API_BASE_URL}/usuario/login`, {
          email,
          password
        });
        Swal.close();
        if (res.status === 200 && res.data.error === false && res.data.token) {
          localStorage.setItem("usertoken", res.data.token);
          // Éxito: Redirigir a la zona autenticada
          window.location.href = './inicio.html';
        } else {
          Swal.fire({
            icon: "error",
            title: "Error",
            text: res.data.msg || "No se pudo iniciar sesión."
          });
        }
      } catch (err) {
        Swal.close();
        Swal.fire({
          icon: "error",
          title: "Error de conexión",
          text: err.response?.data?.msg || err.message
        });
      }
    });

    // Login con Google (Movido de historial_compras.html)
    async function handleCredentialResponse(response) {
      Swal.fire({
        title: "Iniciando sesión con Google...",
        allowOutsideClick: false,
        showConfirmButton: false,
        willOpen: () => Swal.showLoading()
      });
      try {
        const res = await axios.post(`${API_BASE_URL}/usuario/google-login`, {
          id_token: response.credential
        });
        Swal.close();
        if (res.status === 200 && res.data.error === false && res.data.token) {
          localStorage.setItem("usertoken", res.data.token);
          // Éxito: Redirigir a la zona autenticada
          window.location.href = './inicio.html';
        } else {
          Swal.fire({
            icon: "error",
            title: "Error de autenticación",
            text: res.data.msg || "No se pudo iniciar sesión con Google."
          });
        }
      } catch (err) {
        Swal.close();
        Swal.fire({
          icon: "error",
          title: "Error de conexión",
          text: err.response?.data?.msg || err.message
        });
      }
    }
  </script>
</body>
</html>
